version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: sanas-boutique-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sanas_boutique
      POSTGRES_USER: sanas
      POSTGRES_PASSWORD: sanas_local_dev
    ports:
      - "5432:5432"
    volumes:
      - sanas_pgdata:/var/lib/postgresql/data

volumes:
  sanas_pgdata:
