spring:
  application:
    name: sanas-boutique-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sanas_boutique}
    username: ${DB_USERNAME:sanas}
    password: ${DB_PASSWORD:sanas_local_dev}

  jpa:
    hibernate:
      # Schema is owned by Flyway migrations, never by Hibernate.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      # Spring Boot's own defaults (1MB file / 10MB request) reject a
      # typical phone photo. Raised for item-photo uploads.
      max-file-size: 15MB
      max-request-size: 15MB

server:
  port: ${SERVER_PORT:8080}
  error:
    # Lets the UI show messages such as "Invalid mobile number or password".
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    # Overridden per environment. Never commit a real secret — use
    # application-local.yml (gitignored) or an environment variable.
    secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me}
    # 12 hours - staff sign in once at shift start and shouldn't get logged
    # out mid-shift. There's no refresh-token flow yet, so this IS the
    # session length; raise/lower via JWT_ACCESS_TTL_MIN per environment.
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MIN:720}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
  otp:
    # TEMPORARY: no SMS/WhatsApp yet, so the forgot-password OTP is returned to the UI.
    # Set OTP_EXPOSE_IN_RESPONSE=false once an SMS sender delivers it instead.
    expose-in-response: ${OTP_EXPOSE_IN_RESPONSE:true}
    ttl-minutes: 10
    max-attempts: 5
  jobs:
    parlour-auto-cancel:
      # Switched off (owner decision 2026-10-11: no scheduler). Leftover bookings are cancelled per
      # outlet at login and when the Parlour / Jewellery rental screen is opened.
      enabled: ${PARLOUR_AUTO_CANCEL_ENABLED:false}
  storage:
    # Dev-mode placeholder bucket name (see StubImageStorageService) -
    # uploaded item photos aren't actually written anywhere yet. Point
    # this at the real bucket via GCS_BUCKET before enabling real uploads.
    gcs-bucket: ${GCS_BUCKET:sanas-boutique-catalog}

logging:
  level:
    com.sanasboutique: INFO
